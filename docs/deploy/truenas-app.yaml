# TrueNAS SCALE: Apps -> Discover Apps -> (three-dot menu) -> Install via YAML.
# Change only the dataset path on the volumes line. Nothing else to fill in:
# the access token is generated on first start (shown in the app logs, saved as token.txt).
services:
  midimcp:
    image: ghcr.io/bgoldbeck/midimcp:latest
    pull_policy: always
    restart: unless-stopped
    user: "568:568"
    ports:
      - "8765:8765"
    volumes:
      - /mnt/YOUR_POOL/midimcp:/data
