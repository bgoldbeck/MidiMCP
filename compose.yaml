# Local build + run:   docker compose up -d --build
# The access token is generated on first start: see the logs or ./data/token.txt
# TrueNAS: see docs/deploy/truenas.md
services:
  midimcp:
    build: .
    image: midimcp:latest
    container_name: midimcp
    restart: unless-stopped
    user: "${PUID:-568}:${PGID:-568}"
    ports:
      - "${MIDIMCP_PORT:-8765}:8765"
    environment:
      MIDIMCP_TOKEN: ${MIDIMCP_TOKEN:-}
      MIDIMCP_DATA_DIR: /data
      MIDIMCP_LOG_LEVEL: ${MIDIMCP_LOG_LEVEL:-INFO}
    volumes:
      - ${MIDIMCP_DATA_PATH:-./data}:/data
