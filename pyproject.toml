[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "midimcp"
version = "0.1.0"
description = "AI-controlled retro MIDI composer for 1990s-style fantasy RPG music, driven over MCP."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "mcp>=2.3,<3",
  "mido>=1.3,<2",
  "pydantic>=2.7,<3",
  "uvicorn>=0.30",
]

[project.scripts]
midimcp = "midimcp.server:main"

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/midimcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
